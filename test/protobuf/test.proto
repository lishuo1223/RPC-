syntax = "proto3";

package fix_bug; //声明了代码所在的包，对于c++来说就是namespace

//表示生成service服务类和rpc方法描述，默认不生成
option cc_generic_services = true;

message ResultCode {
    int32 errcode = 1;
    string errmsg = 2;
}

//登陆消息请求类型   name pwd
message LoginRequest {
    string name = 1;   
    string pwd = 2;
    map<int32,string> test = 3;
}

//定义登陆响应类型
message LoginResponse {
    ResultCode result = 1;
    bool success = 2;
}

message GetFriendListsRequest {
    uint32 userid = 1;
    ResultCode result = 2;
}
message User {
    bytes name = 1;
    uint32 age = 2;
    enum Sex{
        MAN = 0;
        WOMAN = 1;
    }
    Sex sex = 3;
}
message GetFriendListsResponse{
    ResultCode result = 1;
    repeated User friend_list = 2;
}
//在rpc中定义rpc方法的类型  -service
service UserServiceRpc {
    rpc Login(LoginRequest) returns(LoginResponse);
    rpc GetFriendsLists(GetFriendListsRequest) returns(GetFriendListsResponse);
}

